[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-rag"
version = "0.1.0"
description = "Agentic RAG starter kit"
requires-python = ">=3.12,<3.14"

dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "langchain>=1.4,<2",
    "langchain-openai>=1.6,<2",
    "pymilvus>=3.0,<4",
    # Exact pin: bump together with uv.lock and re-validate the agent.
    "ai4rag==0.25.4",
    "flask>=3.1",
    "httpx2>=2.12,<3",
    "python-dotenv>=1.1",
    "openai>=2.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
