apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/opendatahub-io/pipelines-components?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "false"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-cel-expression: |
      event == "push"
      && target_branch == "main"
      && (
        "components/training/autorag/**".pathChanged()
        || "components/data_processing/autorag/**".pathChanged()
        || "pipelines/training/autorag/**".pathChanged()
        || "pipelines/data_processing/autorag/**".pathChanged()
        || ".tekton/odh-autorag-ci-on-push.yaml".pathChanged()
      )
      && !(
        files.all(f,
          f.matches(".*\\.md$")
          || f.matches(".*/tests/.*")
          || f.matches(".*_test\\.py$")
          || f.matches(".*/metadata\\.yaml$")
        )
      )
  creationTimestamp: null
  labels:
    appstudio.openshift.io/application: opendatahub-builds
    appstudio.openshift.io/component: odh-autorag-ci
    pipelines.appstudio.openshift.io/type: build
  name: odh-autorag-on-push
  namespace: open-data-hub-tenant
spec:
  params:
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  - name: output-image
    value: quay.io/opendatahub/odh-autorag:odh-stable
  - name: dockerfile
    value: pipelines/training/autorag/documents_rag_optimization_pipeline/Containerfile
  - name: path-context
    value: .
  pipelineRef:
    resolver: git
    params:
    - name: url
      value: https://github.com/opendatahub-io/odh-konflux-central.git
    - name: revision
      value: main
    - name: pathInRepo
      value: pipeline/multi-arch-container-build.yaml
  taskRunTemplate:
    serviceAccountName: build-pipeline-odh-autorag-ci
  workspaces:
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
status: {}
