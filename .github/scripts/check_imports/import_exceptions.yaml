---
modules:
  - pytest
  - kfp
  - kfp_components
  - components
  - pipelines
files:
  # Allow any file in test directories to import from tests module
  # Glob patterns: * matches any directory, ** matches any path
  "components/**/tests/*":
    - tests
    - pandas
    # Flat import of embedded shared helpers (same layout as KFP task containers).
    - run_status
  "components/**/shared/*":
    - pandas
    - component
  "pipelines/**/tests/*":
    - tests
  # Allow pipelines to import the repo package at module scope
  "pipelines/*.py":
    - kfp_components
  "pipelines/**/*.py":
    - kfp_components
