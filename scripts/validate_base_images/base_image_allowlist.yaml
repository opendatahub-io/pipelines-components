---
# Base image allowlist for scripts/validate_base_images/validate_base_images.py
#
# This file defines base images that are permitted when validating
# components/pipelines.
#
# Keep patterns anchored (use ^ and $) where possible to avoid overly-broad
# matches.
#
# Schema:
# - allowed_images: exact image strings
# - allowed_image_patterns: list of regex patterns matched against the full image
allowed_images:
  - 'quay.io/opendatahub/odh-th06-cpu-torch291-py312:odh-3.4'
  - 'quay.io/opendatahub/odh-th-torch-cuda-py312:odh-3.6-ea.2'
  - 'registry.access.redhat.com/ubi9/python-311:latest'
allowed_image_patterns:
  - '^ghcr\.io/kubeflow/.*$'
  - '^python:\d+\.\d+.*$'
  - '^registry\.redhat\.io/.*$'
  # Managed OpenShift AI runtime images (AutoML / AutoRAG); tag varies (e.g. odh-stable, odh-pr).
  - '^quay\.io/opendatahub/odh-[\w-]+:odh-.+$'
