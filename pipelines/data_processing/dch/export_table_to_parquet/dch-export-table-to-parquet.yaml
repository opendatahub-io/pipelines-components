# PIPELINE DEFINITION
# Name: dch-export-table-to-parquet
# Description: Check DCH access, then export the selected table and an HTML report.
# Inputs:
#    DCH_HOST: str
#    connection_id: str
#    max_snapshot_size_bytes: int [Default: 1073741824.0]
#    source_table: str
# Outputs:
#    report: system.HTML
#    snapshot: system.Dataset
#    snapshot_uri: str
components:
  comp-export-table-to-parquet:
    executorLabel: exec-export-table-to-parquet
    inputDefinitions:
      parameters:
        connection_id:
          description: ID of a saved SQL-capable relational DCH connection in the
            task namespace.
          parameterType: STRING
        dch_host:
          description: DCH gateway hostname and optional port requested for the run.
          parameterType: STRING
        max_snapshot_size_bytes:
          defaultValue: 1073741824.0
          description: Maximum size in bytes of the staged Parquet file, including
            its footer.
          isOptional: true
          parameterType: NUMBER_INTEGER
        source_table:
          description: Source table in schema.table_name format, such as analytics.customers.
          parameterType: STRING
        trusted_host:
          description: 'Optional HTTPS gateway restriction set by the pipeline author.

            An empty value uses dch_host as the endpoint for the task ServiceAccount
            token.'
          parameterType: STRING
    outputDefinitions:
      artifacts:
        report:
          artifactType:
            schemaTitle: system.HTML
            schemaVersion: 0.0.1
        snapshot:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        snapshot_uri:
          parameterType: STRING
deploymentSpec:
  executors:
    exec-export-table-to-parquet:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - export_table_to_parquet
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'data-connect-hub[flight]\
          \ @ git+https://github.com/opendatahub-io/data-connect-hub.git@6d58bc9975a431c8f8a9040e610520d20c980f36#subdirectory=sdk/python'\
          \  &&  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.16.1'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef export_table_to_parquet(\n    dch_host: str,\n    connection_id:\
          \ str,\n    trusted_host: str,\n    source_table: str,\n    snapshot: dsl.Output[dsl.Dataset],\n\
          \    report: dsl.Output[dsl.HTML],\n    max_snapshot_size_bytes: int = 1_073_741_824,\n\
          ) -> NamedTuple(\"Outputs\", [(\"snapshot_uri\", str)]):\n    \"\"\"Export\
          \ a relational table through a saved DCH Flight SQL connection.\n\n    Uses\
          \ the gateway CA and task token to look up the saved connection and read\n\
          \    the selected table through Flight SQL. Publishes a Parquet dataset\
          \ and\n    HTML report through KFP.\n\n    Args:\n        dch_host: DCH\
          \ gateway hostname and optional port requested for the run.\n        connection_id:\
          \ ID of a saved SQL-capable relational DCH connection in the task namespace.\n\
          \        trusted_host: Optional HTTPS gateway restriction set by the pipeline\
          \ author.\n            An empty value uses dch_host as the endpoint for\
          \ the task ServiceAccount token.\n        source_table: Source table in\
          \ schema.table_name format, such as analytics.customers.\n        snapshot:\
          \ Parquet dataset artifact.\n        report: HTML report with check results\
          \ and snapshot statistics.\n        max_snapshot_size_bytes: Maximum size\
          \ in bytes of the staged Parquet file, including its footer.\n\n    Returns:\n\
          \        The exact artifact URI of the Parquet file.\n    \"\"\"\n    import\
          \ os\n    import re\n    from contextlib import closing\n    from html import\
          \ escape\n    from io import BufferedWriter\n    from pathlib import Path\n\
          \    from tempfile import TemporaryDirectory\n    from urllib.parse import\
          \ urlsplit\n\n    import pyarrow as pa\n    import pyarrow.parquet as pq\n\
          \    from data_connect_hub import DataConnectClient, DCHError\n\n    gateway\
          \ = (trusted_host or dch_host).strip().rstrip(\"/\")\n    table_parts =\
          \ [identifier.strip() for identifier in source_table.split(\".\", 2)]\n\
          \    ca = os.getenv(\"SSL_CERT_FILE\") or None\n    account = Path(\"/var/run/secrets/kubernetes.io/serviceaccount\"\
          )\n    checks = dict.fromkeys(\n        (\n            \"Gateway and input\"\
          ,\n            \"Task ServiceAccount token\",\n            \"DCH connection\
          \ lookup\",\n            \"Parquet snapshot\",\n        ),\n        \"SKIP\"\
          ,\n    )\n    details = {}\n\n    class SnapshotSizeLimitExceeded(ValueError):\n\
          \        \"\"\"A Parquet write would exceed the configured size limit.\"\
          \"\"\n\n    class BoundedSnapshotWriter(BufferedWriter):\n        \"\"\"\
          Check the file position before passing each write to disk.\"\"\"\n\n   \
          \     def write(self, data):\n            if self.tell() + len(data) > max_snapshot_size_bytes:\n\
          \                raise SnapshotSizeLimitExceeded\n            return super().write(data)\n\
          \n    def start(name, detail):\n        print(f\"[START] {name} | {detail}\"\
          , flush=True)\n\n    def record(name, status, detail):\n        checks[name]\
          \ = status\n        details[name] = detail\n        print(f\"[{status}]\
          \ {name} | {detail}\", flush=True)\n\n    def log_failure(name, exc):\n\
          \        # Translate known failures without printing exception messages\
          \ or response bodies.\n        hints = (\n            (\n              \
          \  \"failed to obtain credentials\",\n                \"Flight could not\
          \ obtain the saved source credentials.\",\n            ),\n            (\"\
          secret not found\", \"The saved source Secret is missing or inaccessible\
          \ to Flight.\"),\n            (\"unauthenticated\", \"Check the runner token\
          \ and the DCH token audience.\"),\n            (\"permission denied\", \"\
          Check the runner's DCH tenant permissions.\"),\n            (\"certificate\
          \ verify failed\", \"Check the relevant server certificate and CA trust.\"\
          ),\n            (\"password authentication failed\", \"The source database\
          \ rejected the saved credentials.\"),\n            (\"could not translate\
          \ host name\", \"The server hostname could not be resolved.\"),\n      \
          \      (\"connection refused\", \"The server refused the connection.\"),\n\
          \            (\"timed out\", \"The connection or query timed out.\"),\n\
          \        )\n        raw_message = str(exc).lower()\n        hint = next((detail\
          \ for text, detail in hints if text in raw_message), \"\")\n        http_status\
          \ = getattr(exc, \"status_code\", None)\n        details = [type(exc).__name__]\n\
          \        if isinstance(http_status, int):\n            details.append(f\"\
          HTTP {http_status}\")\n        if http_status == 401:\n            hint\
          \ = \"Check the runner token and the DCH token audience.\"\n        elif\
          \ http_status == 403:\n            hint = \"Check the runner's DCH tenant\
          \ permissions.\"\n        elif http_status == 404:\n            hint = \"\
          Check the connection ID and the DCH tenant namespace.\"\n        if hint:\n\
          \            details.append(hint)\n        record(name, \"FAIL\", \" | \"\
          .join(details))\n\n    def authority(value):\n        value = value.strip()\n\
          \        if \"\\\\\" in value or any(character.isspace() or ord(character)\
          \ < 32 for character in value):\n            raise ValueError(\"Expected\
          \ an HTTPS gateway hostname and optional port\")\n        parsed = urlsplit(value\
          \ if \"://\" in value else f\"https://{value}\")\n        if (\n       \
          \     parsed.scheme != \"https\"\n            or not parsed.hostname\n \
          \           or parsed.username is not None\n            or parsed.path not\
          \ in (\"\", \"/\")\n            or parsed.query\n            or parsed.fragment\n\
          \            or parsed.port == 0\n        ):\n            raise ValueError(\"\
          Expected an HTTPS gateway hostname and optional port\")\n        return\
          \ parsed.hostname, parsed.port or 443\n\n    def read_token():\n       \
          \ return (account / \"token\").read_text().strip()\n\n    def dch_client(tenant,\
          \ flight_timeout):\n        return DataConnectClient(\n            endpoint=gateway,\n\
          \            tenant_id=tenant,\n            token_provider=read_token,\n\
          \            ca_cert=ca,\n            rest_timeout=20,\n            flight_timeout=flight_timeout,\n\
          \            max_retries=0,\n        )\n\n    def run_checks():\n      \
          \  name = \"Gateway and input\"\n        start(name, \"Validating DCH_HOST\
          \ before sending the ServiceAccount token.\")\n        if type(max_snapshot_size_bytes)\
          \ is not int or max_snapshot_size_bytes <= 0:\n            record(name,\
          \ \"FAIL\", \"max_snapshot_size_bytes must be a positive integer.\")\n \
          \           return\n        try:\n            requested_authority = authority(dch_host)\n\
          \            if trusted_host and requested_authority != authority(trusted_host):\n\
          \                record(name, \"FAIL\", f\"DCH_HOST must match the compiled\
          \ gateway {trusted_host}.\")\n                return\n        except ValueError:\n\
          \            record(name, \"FAIL\", \"Expected an HTTPS gateway hostname\
          \ with an optional port.\")\n            return\n        if not re.fullmatch(r\"\
          [A-Za-z0-9._-]{1,128}\", connection_id):\n            record(name, \"FAIL\"\
          , \"The connection ID is empty or has an invalid format.\")\n          \
          \  return\n        if len(table_parts) != 2 or not all(table_parts) or \"\
          \\0\" in source_table:\n            record(name, \"FAIL\", \"Provide source_table\
          \ in schema.table_name format, such as analytics.customers.\")\n       \
          \     return\n        record(name, \"PASS\", f\"Using DCH gateway {gateway}.\"\
          )\n\n        name = \"Task ServiceAccount token\"\n        start(name, \"\
          Checking the task pod's mounted Kubernetes token and namespace.\")\n   \
          \     try:\n            tenant = (account / \"namespace\").read_text().strip()\n\
          \            if not tenant or not read_token():\n                raise ValueError(\"\
          Empty namespace or token\")\n        except (OSError, ValueError):\n   \
          \         record(name, \"FAIL\", \"The default Kubernetes token or namespace\
          \ file is unavailable.\")\n            return\n        record(name, \"PASS\"\
          , f\"Using the run namespace as DCH tenant: {tenant}.\")\n\n        name\
          \ = \"DCH connection lookup\"\n        trust = \"launcher CA bundle\" if\
          \ ca else \"default CA trust\"\n        start(name, f\"Looking up the saved\
          \ connection via DCH REST using {trust}.\")\n        try:\n            with\
          \ dch_client(tenant, flight_timeout=20) as client:\n                connection\
          \ = client.get_connection(connection_id)\n                if connection.format\
          \ != \"tabular\":\n                    record(name, \"FAIL\", \"The saved\
          \ connection is not tabular.\")\n                    return\n          \
          \      record(name, \"PASS\", f\"DCH REST returned the connection using\
          \ {trust}.\")\n        except (DCHError, OSError, ValueError, KeyError,\
          \ IndexError) as exc:\n            log_failure(name, exc)\n            return\n\
          \        return tenant\n\n    def quote_identifier(identifier):\n      \
          \  return '\"' + identifier.replace('\"', '\"\"') + '\"'\n\n    def write_snapshot(tenant):\n\
          \        name = \"Parquet snapshot\"\n        source = \".\".join(quote_identifier(identifier)\
          \ for identifier in table_parts)\n        start(name, f\"Reading {source}\
          \ through DCH Flight SQL.\")\n        query = f\"SELECT * FROM {source}\"\
          \n        if not snapshot.uri:\n            raise ValueError(\"KFP did not\
          \ assign a snapshot artifact URI\")\n        snapshot.uri += \".parquet\"\
          \n        destination = Path(snapshot.path)\n        destination.parent.mkdir(parents=True,\
          \ exist_ok=True)\n        row_count = 0\n        with (\n            TemporaryDirectory(dir=destination.parent)\
          \ as tmp,\n            dch_client(tenant, flight_timeout=300) as client,\n\
          \            closing(client.read_batches(query, connection_id)) as batches,\n\
          \        ):\n            temporary_path = Path(tmp) / \"snapshot.parquet\"\
          \n            with BoundedSnapshotWriter(temporary_path.open(\"wb\", buffering=0))\
          \ as sink:\n                first_batch = next(batches, None)\n        \
          \        if first_batch is None:\n                    empty_table = client.read(f\"\
          {query} LIMIT 0\", connection_id)\n                    schema = empty_table.schema\n\
          \                    pq.write_table(empty_table, sink)\n               \
          \ else:\n                    schema = first_batch.schema\n             \
          \       with pq.ParquetWriter(sink, schema) as writer:\n               \
          \         writer.write_batch(first_batch)\n                        row_count\
          \ = first_batch.num_rows\n                        for batch in batches:\n\
          \                            writer.write_batch(batch)\n               \
          \             row_count += batch.num_rows\n            temporary_path.replace(destination)\n\
          \n        snapshot.metadata.update(\n            format=\"parquet\",\n \
          \           row_count=row_count,\n            column_count=len(schema),\n\
          \            size_bytes=destination.stat().st_size,\n        )\n       \
          \ record(name, \"PASS\", f\"Wrote {row_count:,} rows and {len(schema):,}\
          \ columns to {snapshot.uri}.\")\n\n    def write_report():\n        check_rows\
          \ = \"\".join(\n            f\"<tr><th scope='row'>{escape(name)}</th><td>{status}</td><td>{escape(details[name])}</td></tr>\"\
          \n            for name, status in checks.items()\n        )\n        metadata\
          \ = snapshot.metadata\n        report_path = Path(report.path)\n       \
          \ report_path.parent.mkdir(parents=True, exist_ok=True)\n        report_path.write_text(\n\
          \            \"<!doctype html><html lang='en'><meta charset='utf-8'>\"\n\
          \            \"<title>DCH table snapshot</title><body><h1>DCH table snapshot</h1>\"\
          \n            \"<p>Overall result: <strong>PASS</strong></p><dl>\"\n   \
          \         f\"<dt>Table</dt><dd><code>{escape('.'.join(table_parts))}</code></dd>\"\
          \n            f\"<dt>Rows</dt><dd>{metadata['row_count']:,}</dd>\"\n   \
          \         f\"<dt>Columns</dt><dd>{metadata['column_count']:,}</dd>\"\n \
          \           f\"<dt>Parquet size</dt><dd>{metadata['size_bytes']:,} bytes</dd>\"\
          \n            f\"<dt>Location</dt><dd><code>{escape(snapshot.uri)}</code></dd></dl>\"\
          \n            \"<h2>Checks</h2><table><thead><tr><th>Check</th><th>Status</th>\"\
          \n            f\"<th>Detail</th></tr></thead><tbody>{check_rows}</tbody></table></body></html>\"\
          ,\n            encoding=\"utf-8\",\n        )\n\n    print(\"[START] DCH\
          \ table export\", flush=True)\n    tenant = run_checks()\n    if tenant\
          \ is not None:\n        try:\n            write_snapshot(tenant)\n     \
          \       write_report()\n        except SnapshotSizeLimitExceeded:\n    \
          \        record(\n                \"Parquet snapshot\",\n              \
          \  \"FAIL\",\n                f\"Parquet file exceeds max_snapshot_size_bytes\
          \ ({max_snapshot_size_bytes:,} bytes). \"\n                \"Export a smaller\
          \ table or raise the limit if the pod has enough disk space.\",\n      \
          \      )\n        except (DCHError, pa.ArrowException, OSError, ValueError)\
          \ as exc:\n            log_failure(\"Parquet snapshot\", exc)\n    for name,\
          \ status in checks.items():\n        if status == \"SKIP\":\n          \
          \  print(f\"[SKIP] {name} | A prerequisite check did not pass.\", flush=True)\n\
          \n    failed = [name for name, status in checks.items() if status == \"\
          FAIL\"]\n    if failed:\n        print(f\"[FAIL] Overall result | Failed\
          \ checks: {', '.join(failed)}.\", flush=True)\n        raise SystemExit(1)\n\
          \    print(\"[PASS] Overall result | All checks passed.\", flush=True)\n\
          \    return (snapshot.uri,)\n\n"
        image: registry.access.redhat.com/ubi9/python-312:latest
pipelineInfo:
  description: Check DCH access, then export the selected table and an HTML report.
  name: dch-export-table-to-parquet
root:
  dag:
    outputs:
      artifacts:
        report:
          artifactSelectors:
          - outputArtifactKey: report
            producerSubtask: export-table-to-parquet
        snapshot:
          artifactSelectors:
          - outputArtifactKey: snapshot
            producerSubtask: export-table-to-parquet
      parameters:
        snapshot_uri:
          valueFromParameter:
            outputParameterKey: snapshot_uri
            producerSubtask: export-table-to-parquet
    tasks:
      export-table-to-parquet:
        cachingOptions: {}
        componentRef:
          name: comp-export-table-to-parquet
        inputs:
          parameters:
            connection_id:
              componentInputParameter: connection_id
            dch_host:
              componentInputParameter: DCH_HOST
            max_snapshot_size_bytes:
              componentInputParameter: max_snapshot_size_bytes
            source_table:
              componentInputParameter: source_table
            trusted_host:
              runtimeValue:
                constant: ''
        taskInfo:
          name: export-table-to-parquet
  inputDefinitions:
    parameters:
      DCH_HOST:
        description: DCH gateway hostname and optional port for the run.
        parameterType: STRING
      connection_id:
        description: ID of the saved SQL-capable relational DCH connection in the
          run namespace.
        parameterType: STRING
      max_snapshot_size_bytes:
        defaultValue: 1073741824.0
        description: Maximum size in bytes of the staged Parquet file, including its
          footer.
        isOptional: true
        parameterType: NUMBER_INTEGER
      source_table:
        description: Source table in schema.table_name format, such as analytics.customers.
        parameterType: STRING
  outputDefinitions:
    artifacts:
      report:
        artifactType:
          schemaTitle: system.HTML
          schemaVersion: 0.0.1
      snapshot:
        artifactType:
          schemaTitle: system.Dataset
          schemaVersion: 0.0.1
    parameters:
      snapshot_uri:
        parameterType: STRING
schemaVersion: 2.1.0
sdkVersion: kfp-2.16.1
