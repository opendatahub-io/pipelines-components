      version: '>=0.20.0'
    - name: Model Registry
      version: '>=0.3.4'
    - name: OpenShift AI (KServe)
      version: '>=2.10.0'
    - name: vLLM ServingRuntime
      version: '>=0.24.0'
    - name: vLLM
      version: '>=0.9.0'
    - name: GuideLLM
      version: '~=0.7.1'
tags:
