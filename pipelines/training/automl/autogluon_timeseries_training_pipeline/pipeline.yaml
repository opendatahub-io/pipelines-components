deploymentSpec:
  executors:
    exec-autogluon-timeseries-models-training:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - autogluon_timeseries_models_training
        command:
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef autogluon_timeseries_models_training(\n    target: str,\n   \
          \ id_column: str,\n    timestamp_column: str,\n    train_data_path: str,\n\
          \    test_data: dsl.Input[dsl.Dataset],\n    top_n: int,\n    workspace_path:\
          \ str,\n    pipeline_name: str,\n    run_id: str,\n    models_artifact:\
          \ dsl.Output[dsl.Model],\n    extra_train_data_path: str,\n    html_artifact:\
          \ dsl.Output[dsl.HTML],\n    component_status: dsl.Output[dsl.Artifact],\n\
          \    sample_rows: str = \"[]\",\n    sampling_config: Optional[dict] = None,\n\
          \    split_config: Optional[dict] = None,\n    prediction_length: int =\
          \ 1,\n    known_covariates_names: Optional[List[str]] = None,\n    preset:\
          \ str = \"speed\",\n    eval_metric: str = \"mean_absolute_scaled_error\"\
          ,\n    evaluation_mode: str = \"auto-split\",\n) -> NamedTuple(\n    \"\
          outputs\",\n    top_models=List[str],\n    predictor_path=str,\n    eval_metric=str,\n\
          \    model_config=dict,\n    best_model_name=str,\n):\n    \"\"\"Train,\
          \ select, and full-refit top N AutoGluon timeseries models.\n\n    This\
          \ component combines model generation and full-refit into one step to avoid\n\
          \    pipeline-level ``ParallelFor``. It trains multiple AutoGluon TimeSeries\
          \ models on\n    the selection training data, ranks them on the test set,\
          \ then sequentially refits\n    the top N models on full train data (selection\
          \ split + extra split).\n\n    Refit outputs for all selected models are\
          \ written under one ``models_artifact``,\n    and a ranked HTML leaderboard\
          \ is written to ``html_artifact``.\n\n    Args:\n        target: Name of\
          \ the target column to forecast.\n        id_column: Name of the column\
          \ identifying each time series (item_id).\n        timestamp_column: Name\
          \ of the timestamp/datetime column.\n        train_data_path: Path to the\
          \ selection training CSV file.\n        test_data: Test dataset artifact\
          \ for evaluation.\n        top_n: Number of top models to select for full\
          \ refit.\n        workspace_path: Workspace directory where predictor will\
          \ be saved.\n        pipeline_name: Pipeline name used in generated notebook\
          \ placeholders.\n        run_id: Pipeline run id used in generated notebook\
          \ placeholders.\n        models_artifact: Combined output artifact containing\
          \ all refitted models.\n        extra_train_data_path: Path to extra train\
          \ split for full refit.\n        html_artifact: Output HTML artifact containing\
          \ the ranked leaderboard page.\n        sample_rows: Sample rows JSON string\
          \ used in generated notebook placeholders.\n        sampling_config: Optional\
          \ sampling config stored in artifact metadata.\n        split_config: Optional\
          \ split config stored in artifact metadata.\n        prediction_length:\
          \ Forecast horizon (number of timesteps).\n        known_covariates_names:\
          \ Optional list of known covariate column names.\n        component_status:\
          \ Output artifact containing stage-level progress tracking for this component.\n\
          \        preset: Training quality tier. ``\"speed\"`` (default) or ``\"\
          balanced\"``\n            (may run more than 2x longer).\n        eval_metric:\
          \ Metric for model ranking (e.g. ``\"mean_absolute_scaled_error\"``,\n \
          \           ``\"weighted_quantile_loss\"``). Defaults to ``\"mean_absolute_scaled_error\"\
          ``.\n            Legacy uppercase acronyms (e.g. ``\"MASE\"``) are accepted\
          \ and normalized to snake_case.\n        evaluation_mode: Evaluation mode\
          \ from data loader (\"user-provided\" or \"auto-split\").\n            \"\
          user-provided\" indicates test data was provided by the user, \"auto-split\"\
          \ indicates\n            test data was created by automatically splitting\
          \ training data. Used by downstream\n            pipeline components for\
